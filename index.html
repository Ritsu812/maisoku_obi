<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マイソク帯変換ツール</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;background:#f0f2f5;color:#1a1a2e;font-size:13px}
.app{display:flex;flex-direction:column;height:100vh}
.hdr{display:flex;align-items:center;gap:14px;padding:0 18px;height:52px;flex-shrink:0;background:#1a1a2e;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hdr-title{font-size:16px;font-weight:700}
.obi-info{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border-radius:6px;padding:5px 10px;margin-left:auto;font-size:12px;cursor:pointer;position:relative}
.obi-info .label{color:#aaa;font-size:10px}
.obi-info .name{color:#fff;font-weight:600;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obi-info input{position:absolute;inset:0;opacity:0;cursor:pointer}
.obi-info.custom{background:rgba(46,196,122,.2)}
.obi-info.warn{background:rgba(255,152,0,.25);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.btn-quit{padding:6px 14px;background:#e63946;color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer}
.main{display:flex;flex:1;overflow:hidden}
.left{width:360px;flex-shrink:0;border-right:1px solid #e6e7ea;display:flex;flex-direction:column;background:#fafbfc}
.right{flex:1;display:flex;flex-direction:column;background:#fff}
.sec-header{padding:12px 14px 6px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sec-label{font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.08em}
.hdr-btns{display:flex;gap:4px;align-items:center}
.total-label{font-size:11px;color:#888}
.btn-sm{font-size:10px;padding:3px 9px;border:1px solid #ddd;background:#fff;color:#888;border-radius:5px;cursor:pointer;font-weight:600}
.btn-sm:hover:not(:disabled){background:#f0f2f5}
.btn-sm:disabled{opacity:.4;cursor:not-allowed}
.btn-sm.danger:hover:not(:disabled){background:#fdecea;border-color:#e63946;color:#e63946}
.btn-sm.skip{cursor:pointer}
.btn-sm.skip:hover:not(:disabled){background:#fff8e1;border-color:#ff9800;color:#ff9800}
.btn-sm.skip.on{background:#ff9800;border-color:#ff9800;color:#fff}
.status-wrap{padding:0 14px 6px;flex-shrink:0}
.status{padding:7px 10px;border-radius:6px;font-size:11px;font-weight:500;display:none;white-space:pre-wrap}
.status.info{background:#e8f0fe;color:#2d5be3;display:block}
.status.success{background:#e6faf1;color:#1a8a52;display:block}
.status.error{background:#fdecea;color:#c0392b;display:block}
.status.loading{background:#fff8e1;color:#b8860b;display:block}
.page-list{flex:1;overflow-y:auto;padding:4px 8px 8px}
.page-item{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:7px;margin-bottom:3px;cursor:pointer;background:#fff;border:1px solid transparent;transition:all .1s}
.page-item:hover{background:#f0f4ff}
.page-item.active{background:#e8f0fe;border-color:#4361ee}
.page-item.dragging{opacity:.4}
.page-item.drag-over{border-color:#4361ee;background:#f0f4ff}
.page-item.skipped{opacity:.6}
.drag-handle{color:#ccc;font-size:14px;cursor:grab;flex-shrink:0;user-select:none}
.pinfo{flex:1;min-width:0}
.pname{font-size:12px;font-weight:600;color:#333}
.pfname{font-size:10px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pright{display:flex;align-items:center;gap:4px;flex-shrink:0}
.info-tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:12px;background:#e8f0fe;color:#4361ee;white-space:nowrap}
.info-tag.def{background:#f0f2f5;color:#aaa}
.skip-badge{font-size:9px;font-weight:700;background:#ff9800;color:#fff;border-radius:3px;padding:1px 4px;margin-left:4px}
.skip-btn{width:24px;height:20px;border:1px solid #ddd;border-radius:4px;background:#fff;color:#999;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0}
.skip-btn:hover{background:#fff8e1;border-color:#ff9800;color:#ff9800}
.skip-btn.on{background:#ff9800;border-color:#ff9800;color:#fff}
.arrow-btns{display:flex;flex-direction:column;gap:1px}
.arrow-btn{width:18px;height:16px;border:1px solid #ddd;border-radius:3px;background:#fff;color:#666;cursor:pointer;font-size:9px;display:flex;align-items:center;justify-content:center;padding:0}
.arrow-btn:hover:not(:disabled){background:#f0f2f5}
.arrow-btn:disabled{opacity:.3;cursor:not-allowed}
.del-btn{width:20px;height:20px;border:1px solid #ddd;border-radius:4px;background:#fff;color:#999;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0}
.del-btn:hover{background:#fdecea;border-color:#e63946;color:#e63946}
.empty-state{padding:30px 16px;text-align:center;color:#bbb;font-size:12px}
.empty-state .icon{font-size:36px;margin-bottom:8px}
.hint-sec{padding:10px 14px;border-top:1px solid #ececef;flex-shrink:0;background:#fff;font-size:10px;color:#999;text-align:center;line-height:1.6}
.page-nav{padding:8px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #ececef;background:#fff;flex-shrink:0}
.btn-add{padding:5px 12px;background:#4361ee;color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;position:relative}
.btn-add input{position:absolute;inset:0;opacity:0;cursor:pointer}
.nav-btn{width:28px;height:28px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;color:#555;display:flex;align-items:center;justify-content:center;font-size:14px}
.nav-btn:hover:not(:disabled){background:#f0f2f5}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.nav-info{flex:1;text-align:center;font-size:12px;color:#555;font-weight:600}
.preview-wrap{flex:1;overflow:auto;background:#e8e8e8;display:flex;align-items:center;justify-content:center;padding:16px;position:relative;transition:background .15s}
.preview-wrap.dragover{background:#d8e4ff}
.preview-wrap.dragover::before{content:"📥 ここにドロップしてPDFを追加";position:absolute;inset:16px;border:3px dashed #4361ee;border-radius:12px;background:rgba(67,97,238,.1);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#4361ee;z-index:10;pointer-events:none}
.preview-placeholder{color:#888;font-size:14px;text-align:center;padding:40px 20px}
.preview-placeholder .icon{font-size:56px;margin-bottom:16px}
.preview-placeholder .main-text{font-size:16px;font-weight:600;color:#555;margin-bottom:8px}
.preview-placeholder .sub-text{font-size:12px;color:#aaa}
.preview-placeholder .add-link{display:inline-block;margin-top:14px;padding:8px 18px;background:#4361ee;color:#fff;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;position:relative}
.preview-placeholder .add-link input{position:absolute;inset:0;opacity:0;cursor:pointer}
.preview-stage{position:relative;display:inline-block;line-height:0;font-size:0;filter:drop-shadow(0 2px 8px rgba(0,0,0,.15));background:#fff;max-width:100%;cursor:pointer}
.preview-stage canvas{display:block;max-width:100%;max-height:calc(100vh - 250px)}
.zone-overlay{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;z-index:2}
.zone-overlay.off{background:rgba(230,57,70,.2);color:rgba(230,57,70,.5)}
.zone-overlay.on{background:transparent;color:transparent}
.zone-overlay.on:hover{background:rgba(46,196,122,.08)}
.zone-overlay.off:hover{background:rgba(230,57,70,.3)}
.cut-line{position:absolute;left:0;right:0;height:3px;background:#e63946;cursor:ns-resize;z-index:3;transform:translateY(-50%)}
.cut-line.inactive{background:transparent;border-top:2px dashed #bbb;height:0}
.cut-line.inactive .cut-line-handle{background:#bbb}
.cut-line.inactive .cut-label{display:none}
.cut-line::before{content:"";position:absolute;left:0;right:0;top:-8px;bottom:-8px;cursor:ns-resize}
.cut-line-handle{position:absolute;top:50%;transform:translateY(-50%);background:#e63946;color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;pointer-events:none}
.cut-line-handle.left-handle{left:6px}
.cut-line-handle.right-handle{right:6px}
.cut-label{position:absolute;left:50%;top:5px;transform:translateX(-50%);background:#e63946;color:#fff;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;pointer-events:none;white-space:nowrap;line-height:1.4}
.cut-line[data-line="bottom"] .cut-label{top:auto;bottom:5px}
.skip-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,152,0,.12);z-index:5}
.skip-overlay span{background:rgba(255,152,0,.9);color:#fff;padding:8px 18px;border-radius:8px;font-size:14px;font-weight:700}
.output-sec{padding:12px 14px;border-top:1px solid #ececef;background:#fff;flex-shrink:0}
.out-row{display:flex;gap:8px;align-items:center}
.out-input{flex:1;padding:9px 12px;border:1.5px solid #ddd;border-radius:7px;font-size:13px;color:#333}
.out-input:focus{outline:none;border-color:#4361ee}
.out-btn{padding:9px 18px;background:#2ec47a;color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.out-btn:hover:not(:disabled){background:#28a564}
.out-btn:disabled{opacity:.4;cursor:not-allowed}
.out-hint{font-size:10px;color:#999;margin-top:6px}
.output-box{margin-top:8px;padding:9px 11px;background:#e6faf1;border-radius:6px;font-size:11px;color:#1a8a52;display:none}
.output-box strong{display:block;margin-bottom:3px;font-size:12px}
.loading-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center}
.loading-overlay.show{display:flex}
.loading-box{background:#fff;border-radius:16px;padding:28px 36px;text-align:center}
.loading-box .spinner{width:36px;height:36px;border:3px solid #eee;border-top-color:#4361ee;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-box p{font-size:13px;color:#555}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="hdr-title">マイソク帯変換ツール</div>
    <label class="obi-info" id="obiInfo">
      <span class="label">自社帯:</span>
      <span class="name" id="obiName">デフォルト</span>
      <input type="file" accept="image/*" onchange="changeObi(this)">
    </label>
  </div>
  <div class="main">
    <div class="left">
      <div class="sec-header">
        <span class="sec-label">ページ一覧</span>
        <div class="hdr-btns">
          <span class="total-label" id="totalLabel"></span>
          <button class="btn-sm skip" id="skipAllBtn" onclick="toggleAllSkip()" disabled>⏩全スキップ</button>
          <button class="btn-sm danger" id="clearAllBtn" onclick="clearAll()" disabled>すべて削除</button>
        </div>
      </div>
      <div class="status-wrap"><div id="pdfStatus" class="status"></div></div>
      <div class="page-list" id="pageList">
        <div class="empty-state"><div class="icon">📋</div>PDFを追加するとここに<br>ページ一覧が表示されます</div>
      </div>
      <div class="hint-sec">💡 プレビューの赤線をドラッグして切り取り位置を調整<br>ゾーン（赤い領域）をクリックで残す/切るを切り替え<br>↑↓キーでページ送り ・ ドラッグで並び替え</div>
    </div>
    <div class="right">
      <div class="page-nav">
        <label class="btn-add">➕ PDFを追加<input type="file" accept=".pdf" multiple onchange="onFileSelect(this)"></label>
        <button class="nav-btn" id="rotateBtn" onclick="rotatePage()" disabled title="90°時計回り">↻</button>
        <button class="nav-btn" id="prevPage" onclick="changePage(-1)" disabled>▲</button>
        <span class="nav-info" id="pageInfo">PDFが選択されていません</span>
        <button class="nav-btn" id="nextPage" onclick="changePage(1)" disabled>▼</button>
      </div>
      <div class="preview-wrap" id="previewWrap" tabindex="0">
        <div class="preview-placeholder">
          <div class="icon">📄</div>
          <div class="main-text">PDFファイルをドラッグ&ドロップ</div>
          <div class="sub-text">または下のボタンから選択（複数同時OK）</div>
          <label class="add-link">ファイルを選択<input type="file" accept=".pdf" multiple onchange="onFileSelect(this)"></label>
        </div>
      </div>
      <div class="output-sec">
        <div class="out-row">
          <input type="text" class="out-input" id="outputFilename" placeholder="出力ファイル名（空欄でデフォルト）">
          <button class="out-btn" id="processBtn" onclick="processAll()" disabled>🖨 PDF出力</button>
        </div>
        <div class="out-hint" id="filenameHint">PDFを追加してください</div>
        <div id="processStatus" class="status"></div>
        <div id="outputBox" class="output-box"></div>
      </div>
    </div>
  </div>
</div>
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box"><div class="spinner"></div><p id="loadingText">処理中...</p></div>
</div>
<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

const DEFAULT_OBI=null;
const PREVIEW_SCALE=1.5, OUTPUT_SCALE=300/72;

let pages=[],currentIdx=0,isDragging=false,activeLine=null,justDragged=false,dragSrcIdx=null;
const obiImg=new Image();
let obiSrc=localStorage.getItem("customObi")||null;
let obiReady=false;
if(obiSrc){obiImg.src=obiSrc;obiReady=true;document.getElementById("obiInfo").classList.add("custom");document.getElementById("obiName").textContent="設定済み"}
else{document.getElementById("obiName").textContent="⚠ 未設定（タップして選択）";document.getElementById("obiInfo").classList.add("warn")}

// ページデータ: {pdfData(ArrayBuffer), pageNum, filename, pageCount, skip, top_line, bottom_line, zones, user_rotation, previewCanvas}
function newPage(pdfData,filename,pageNum,pageCount){
  return{pdfData,filename,pageNum,pageCount,skip:false,top_line:0.85,bottom_line:1.0,zones:[true,false,true],user_rotation:0,previewCanvas:null};
}

async function renderPageToCanvas(p,scale){
  const pdf=await pdfjsLib.getDocument({data:p.pdfData.slice(0)}).promise;
  const page=await pdf.getPage(p.pageNum+1);
  const vp=page.getViewport({scale});
  const c=document.createElement("canvas");
  c.width=vp.width;c.height=vp.height;
  await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
  if(p.user_rotation){
    const rc=document.createElement("canvas");
    const ctx=rc.getContext("2d");
    const rad=p.user_rotation*Math.PI/180;
    if(p.user_rotation===90||p.user_rotation===270){rc.width=c.height;rc.height=c.width}
    else{rc.width=c.width;rc.height=c.height}
    ctx.translate(rc.width/2,rc.height/2);
    ctx.rotate(rad);
    ctx.drawImage(c,-c.width/2,-c.height/2);
    return rc;
  }
  return c;
}

// 帯変更
window.changeObi=function(input){
  const file=input.files[0];if(!file)return;input.value="";
  const reader=new FileReader();
  reader.onload=e=>{
    obiSrc=e.target.result;obiImg.src=obiSrc;obiReady=true;
    try{localStorage.setItem("customObi",obiSrc)}catch(err){}
    const info=document.getElementById("obiInfo");
    info.classList.add("custom");info.classList.remove("warn");
    document.getElementById("obiName").textContent=file.name;
    showStatus("pdfStatus","✓ 帯画像を設定しました","success");
    if(pages.length)document.getElementById("processBtn").disabled=false;
  };
  reader.readAsDataURL(file);
};

// PDF読み込み
const previewWrap=document.getElementById("previewWrap");
previewWrap.addEventListener("dragover",e=>{if(e.dataTransfer.types?.includes("Files")){e.preventDefault();previewWrap.classList.add("dragover")}});
previewWrap.addEventListener("dragleave",e=>{if(e.target===previewWrap)previewWrap.classList.remove("dragover")});
previewWrap.addEventListener("drop",e=>{e.preventDefault();previewWrap.classList.remove("dragover");[...e.dataTransfer.files].filter(f=>f.name.toLowerCase().endsWith(".pdf")).forEach(loadPdfFile)});
window.onFileSelect=function(input){[...input.files].forEach(loadPdfFile);input.value=""};

async function loadPdfFile(file){
  showStatus("pdfStatus",file.name+" を読み込み中...","loading");
  try{
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf.slice(0)}).promise;
    const pc=pdf.numPages;
    const firstIdx=pages.length;
    for(let i=0;i<pc;i++)pages.push(newPage(buf,file.name,i,pc));
    renderPageList();updateOutputUI();updateSkipAllBtn();
    document.getElementById("clearAllBtn").disabled=false;
    document.getElementById("processBtn").disabled=false;
    document.getElementById("processStatus").className="status";
    document.getElementById("outputBox").style.display="none";
    showStatus("pdfStatus","✓ "+file.name+"（"+pc+"ページ）を追加","success");
    await goToPage(firstIdx);
  }catch(e){showStatus("pdfStatus","✗ "+e.message,"error")}
}

// ページ描画
async function goToPage(idx){
  if(idx<0||idx>=pages.length)return;
  currentIdx=idx;renderPageList();updatePageNav();
  document.getElementById("processBtn").disabled=false;
  document.getElementById("rotateBtn").disabled=false;
  showLoading("プレビュー生成中...");
  try{
    const p=pages[idx];
    p.previewCanvas=await renderPageToCanvas(p,PREVIEW_SCALE);
    renderPreview();
  }catch(e){console.error(e)}
  hideLoading();
}

function renderPreview(){
  if(currentIdx<0||currentIdx>=pages.length)return;
  const p=pages[currentIdx];
  const wrap=document.getElementById("previewWrap");
  if(p.skip){
    wrap.innerHTML='<div class="preview-stage"><canvas id="pvCanvas"></canvas><div class="skip-overlay"><span>帯替えスキップ</span></div></div>';
    const c=document.getElementById("pvCanvas");
    c.width=p.previewCanvas.width;c.height=p.previewCanvas.height;
    c.getContext("2d").drawImage(p.previewCanvas,0,0);
    return;
  }
  const tl=p.top_line,bl=p.bottom_line,z=p.zones;
  const blInactive=bl>=0.999;
  wrap.innerHTML='<div class="preview-stage" id="previewStage">'+
    '<canvas id="pvCanvas"></canvas>'+
    '<div class="zone-overlay '+(z[0]?"on":"off")+'" id="zone0" style="top:0;height:'+(tl*100)+'%">'+(z[0]?"":"✕ 切り取り")+'</div>'+
    '<div class="zone-overlay '+(z[1]?"on":"off")+'" id="zone1" style="top:'+(tl*100)+'%;height:'+((bl-tl)*100)+'%">'+(z[1]?"":"✕ 切り取り")+'</div>'+
    '<div class="zone-overlay '+(z[2]?"on":"off")+'" id="zone2" style="top:'+(bl*100)+'%;height:'+((1-bl)*100)+'%">'+(z[2]?"":"✕ 切り取り")+'</div>'+
    '<div class="cut-line" id="topLine" data-line="top" style="top:'+(tl*100)+'%"><div class="cut-label" id="topLabel">'+(tl*100).toFixed(1)+'%</div><div class="cut-line-handle left-handle">⇕</div></div>'+
    '<div class="cut-line '+(blInactive?"inactive":"")+'" id="bottomLine" data-line="bottom" style="top:'+(bl*100)+'%"><div class="cut-label" id="bottomLabel">'+(bl*100).toFixed(1)+'%</div><div class="cut-line-handle right-handle">⇕</div></div>'+
    '</div>';
  const c=document.getElementById("pvCanvas");
  c.width=p.previewCanvas.width;c.height=p.previewCanvas.height;
  c.getContext("2d").drawImage(p.previewCanvas,0,0);
  attachPreviewEvents();
}

function updatePreviewCSS(){
  const p=pages[currentIdx],tl=p.top_line,bl=p.bottom_line;
  const te=document.getElementById("topLine"),be=document.getElementById("bottomLine");
  const z0=document.getElementById("zone0"),z1=document.getElementById("zone1"),z2=document.getElementById("zone2");
  if(te)te.style.top=(tl*100)+"%";
  if(be){be.style.top=(bl*100)+"%";be.classList.toggle("inactive",bl>=0.999)}
  if(z0)z0.style.height=(tl*100)+"%";
  if(z1){z1.style.top=(tl*100)+"%";z1.style.height=((bl-tl)*100)+"%"}
  if(z2){z2.style.top=(bl*100)+"%";z2.style.height=((1-bl)*100)+"%"}
  const tl_=document.getElementById("topLabel"),bl_=document.getElementById("bottomLabel");
  if(tl_)tl_.textContent=(tl*100).toFixed(1)+"%";
  if(bl_)bl_.textContent=(bl*100).toFixed(1)+"%";
}

function attachPreviewEvents(){
  const stage=document.getElementById("previewStage");if(!stage)return;
  ["topLine","bottomLine"].forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    el.addEventListener("mousedown",e=>{e.preventDefault();e.stopPropagation();isDragging=true;activeLine=id;document.body.style.cursor="ns-resize";document.addEventListener("mousemove",onLineMove);document.addEventListener("mouseup",onLineUp)});
    el.addEventListener("touchstart",e=>{e.preventDefault();e.stopPropagation();isDragging=true;activeLine=id;document.addEventListener("touchmove",onLineMove,{passive:false});document.addEventListener("touchend",onLineUp)},{passive:false});
  });
  stage.addEventListener("click",e=>{
    if(isDragging||justDragged)return;
    const c=document.getElementById("pvCanvas");if(!c)return;
    const rect=c.getBoundingClientRect();
    const yRatio=Math.max(0,Math.min(1,(e.clientY-rect.top)/rect.height));
    const p=pages[currentIdx];
    let zi;if(yRatio<p.top_line)zi=0;else if(yRatio<p.bottom_line)zi=1;else zi=2;
    p.zones[zi]=!p.zones[zi];renderPreview();renderPageList();
  });
}

function getY(e){return e.touches?e.touches[0].clientY:e.clientY}
function onLineMove(e){
  if(!isDragging)return;e.preventDefault();
  const c=document.getElementById("pvCanvas");if(!c)return;
  const rect=c.getBoundingClientRect();
  let ratio=(getY(e)-rect.top)/rect.height;
  const p=pages[currentIdx];
  if(activeLine==="topLine"){ratio=Math.max(0,Math.min(0.99,ratio));ratio=Math.min(ratio,p.bottom_line-0.02);p.top_line=ratio}
  else{ratio=Math.max(0.01,Math.min(1,ratio));ratio=Math.max(ratio,p.top_line+0.02);p.bottom_line=ratio}
  updatePreviewCSS();
}
function onLineUp(){
  isDragging=false;activeLine=null;justDragged=true;setTimeout(()=>{justDragged=false},100);
  document.body.style.cursor="";
  document.removeEventListener("mousemove",onLineMove);document.removeEventListener("mouseup",onLineUp);
  document.removeEventListener("touchmove",onLineMove);document.removeEventListener("touchend",onLineUp);
  renderPageList();
}

// 回転
window.rotatePage=async function(){
  if(currentIdx<0||currentIdx>=pages.length)return;
  const p=pages[currentIdx];
  p.user_rotation=(p.user_rotation+90)%360;
  p.top_line=0.85;p.bottom_line=1.0;p.zones=[true,false,true];
  showLoading("回転中...");
  p.previewCanvas=await renderPageToCanvas(p,PREVIEW_SCALE);
  renderPreview();renderPageList();hideLoading();
};

// スキップ
window.toggleSkip=function(idx){
  pages[idx].skip=!pages[idx].skip;renderPageList();updateSkipAllBtn();
  if(idx===currentIdx)renderPreview();
};
window.toggleAllSkip=function(){
  const allSkipped=pages.every(p=>p.skip);
  pages.forEach(p=>{p.skip=!allSkipped});
  renderPageList();updateSkipAllBtn();if(pages.length)renderPreview();
};
function updateSkipAllBtn(){
  const btn=document.getElementById("skipAllBtn");
  if(!pages.length){btn.disabled=true;btn.className="btn-sm skip";btn.textContent="⏩全スキップ";return}
  btn.disabled=false;
  if(pages.every(p=>p.skip)){btn.className="btn-sm skip on";btn.textContent="↩全解除"}
  else{btn.className="btn-sm skip";btn.textContent="⏩全スキップ"}
}

// 削除・並び替え
window.clearAll=function(){
  if(!confirm("すべて削除しますか？"))return;
  pages=[];currentIdx=0;renderPageList();updateOutputUI();updatePageNav();updateSkipAllBtn();
  document.getElementById("clearAllBtn").disabled=true;document.getElementById("processBtn").disabled=true;
  document.getElementById("rotateBtn").disabled=true;resetPlaceholder();
  showStatus("pdfStatus","✓ すべて削除しました","info");
};
window.removePage=function(idx){
  if(!confirm("ページ "+(idx+1)+" を削除？"))return;
  pages.splice(idx,1);if(currentIdx>=pages.length)currentIdx=Math.max(0,pages.length-1);
  renderPageList();updateOutputUI();updateSkipAllBtn();
  if(!pages.length){resetPlaceholder();document.getElementById("processBtn").disabled=true;document.getElementById("clearAllBtn").disabled=true;document.getElementById("rotateBtn").disabled=true;updatePageNav()}
  else goToPage(currentIdx);
};
window.movePage=async function(idx,delta){
  const ni=idx+delta;if(ni<0||ni>=pages.length)return;
  [pages[idx],pages[ni]]=[pages[ni],pages[idx]];
  if(currentIdx===idx)currentIdx=ni;else if(currentIdx===ni)currentIdx=idx;
  renderPageList();updateOutputUI();await goToPage(currentIdx);
};

function resetPlaceholder(){
  document.getElementById("previewWrap").innerHTML='<div class="preview-placeholder"><div class="icon">📄</div><div class="main-text">PDFファイルをドラッグ&ドロップ</div><div class="sub-text">または下のボタンから選択（複数同時OK）</div><label class="add-link">ファイルを選択<input type="file" accept=".pdf" multiple onchange="onFileSelect(this)"></label></div>';
}

// ページ一覧レンダリング
function getPageLabel(p){
  if(p.skip)return"スキップ";
  const tl=p.top_line,bl=p.bottom_line,z=p.zones,k=[];
  if(z[0]&&tl>0.001)k.push("上"+(tl*100).toFixed(0)+"%");
  if(z[1]&&(bl-tl)>0.001)k.push("中"+((bl-tl)*100).toFixed(0)+"%");
  if(z[2]&&(1-bl)>0.001)k.push("下"+((1-bl)*100).toFixed(0)+"%");
  let l=k.length?k.join("+"):"なし";
  if(p.user_rotation)l+=" ↻"+p.user_rotation+"°";
  return l;
}

function renderPageList(){
  const list=document.getElementById("pageList"),total=document.getElementById("totalLabel");
  if(!pages.length){list.innerHTML='<div class="empty-state"><div class="icon">📋</div>PDFを追加するとここに<br>ページ一覧が表示されます</div>';total.textContent="";return}
  total.textContent="全"+pages.length+"ページ";
  list.innerHTML="";
  pages.forEach((p,i)=>{
    const isSkip=p.skip,label=getPageLabel(p);
    const isDef=!isSkip&&Math.abs(p.top_line-0.85)<0.001&&p.bottom_line>=0.999&&p.zones[0]&&!p.zones[1]&&p.zones[2]&&!p.user_rotation;
    const item=document.createElement("div");
    item.className="page-item"+(i===currentIdx?" active":"")+(isSkip?" skipped":"");
    item.draggable=true;item.dataset.idx=i;
    item.innerHTML='<span class="drag-handle">⠿</span><div class="pinfo"><div class="pname">ページ '+(i+1)+(isSkip?' <span class="skip-badge">スキップ</span>':"")+'</div><div class="pfname" title="'+p.filename+'">'+p.filename+'（元p'+(p.pageNum+1)+'）</div></div><div class="pright">'+(isSkip?"":('<span class="info-tag '+(isDef?"def":"")+'">'+label+"</span>"))+'<button class="skip-btn '+(isSkip?"on":"")+'" onclick="event.stopPropagation();toggleSkip('+i+')">'+(isSkip?"⏭":"⏩")+'</button><div class="arrow-btns"><button class="arrow-btn" onclick="event.stopPropagation();movePage('+i+',-1)"'+(i===0?" disabled":"")+'>▲</button><button class="arrow-btn" onclick="event.stopPropagation();movePage('+i+',1)"'+(i===pages.length-1?" disabled":"")+'>▼</button></div><button class="del-btn" onclick="event.stopPropagation();removePage('+i+')">✕</button></div>';
    item.addEventListener("click",()=>goToPage(i));
    item.addEventListener("dragstart",e=>{dragSrcIdx=i;item.classList.add("dragging");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain","p"+i)});
    item.addEventListener("dragend",()=>{item.classList.remove("dragging");list.querySelectorAll(".page-item").forEach(el=>el.classList.remove("drag-over"))});
    item.addEventListener("dragover",e=>{if(e.dataTransfer.types.includes("Files"))return;e.preventDefault();list.querySelectorAll(".page-item").forEach(el=>el.classList.remove("drag-over"));item.classList.add("drag-over")});
    item.addEventListener("drop",e=>{if(e.dataTransfer.types.includes("Files"))return;e.preventDefault();e.stopPropagation();if(dragSrcIdx===null||dragSrcIdx===i)return;const m=pages.splice(dragSrcIdx,1)[0];pages.splice(i,0,m);let nc=currentIdx;if(currentIdx===dragSrcIdx)nc=i;else if(dragSrcIdx<currentIdx&&i>=currentIdx)nc--;else if(dragSrcIdx>currentIdx&&i<=currentIdx)nc++;currentIdx=nc;dragSrcIdx=null;renderPageList();updateOutputUI();goToPage(currentIdx)});
    list.appendChild(item);
  });
}

function updatePageNav(){
  if(!pages.length){document.getElementById("pageInfo").textContent="PDFが選択されていません";document.getElementById("prevPage").disabled=true;document.getElementById("nextPage").disabled=true;return}
  document.getElementById("pageInfo").textContent="ページ "+(currentIdx+1)+" / "+pages.length;
  document.getElementById("prevPage").disabled=currentIdx<=0;
  document.getElementById("nextPage").disabled=currentIdx>=pages.length-1;
}
window.changePage=function(d){goToPage(Math.max(0,Math.min(pages.length-1,currentIdx+d)))};

function updateOutputUI(){
  const hint=document.getElementById("filenameHint");
  if(!pages.length){hint.textContent="PDFを追加してください";return}
  const seen=[];pages.forEach(p=>{if(!seen.includes(p.filename))seen.push(p.filename)});
  const base=seen[0].replace(/\.pdf$/i,"");
  hint.textContent=seen.length>1?"※空欄の場合は「"+base+"_他"+(seen.length-1)+"件_帯替え後.pdf」で保存":"※空欄の場合は「"+base+"_帯替え後.pdf」で保存";
}

// ホイール・キーボード
let wheelTimer=null;
previewWrap.addEventListener("wheel",e=>{
  if(!pages.length)return;const tag=document.activeElement?.tagName;
  if(tag==="INPUT"||tag==="TEXTAREA")return;
  if(Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
  e.preventDefault();clearTimeout(wheelTimer);
  wheelTimer=setTimeout(()=>{changePage(e.deltaY>0?1:-1)},50);
},{passive:false});
document.addEventListener("keydown",e=>{
  if(!pages.length)return;const tag=document.activeElement?.tagName;
  if(tag==="INPUT"&&document.activeElement.type==="text")return;
  if(tag==="TEXTAREA")return;
  if(tag==="INPUT"&&document.activeElement.type==="range")return;
  if(e.key==="ArrowDown"||e.key==="PageDown"){e.preventDefault();changePage(1)}
  else if(e.key==="ArrowUp"||e.key==="PageUp"){e.preventDefault();changePage(-1)}
});

// PDF出力
window.processAll=async function(){
  if(!pages.length)return;
  if(!obiReady){showStatus("processStatus","帯画像を先に設定してください（ヘッダーの「⚠ 未設定」をタップ）","error");return}
  showLoading("PDF出力中...");
  await new Promise(r=>setTimeout(r,50));
  try{
    const jsPDF=await loadJsPDF();
    let targetW=0;
    for(const p of pages){
      if(p.skip)continue;
      const c=await renderPageToCanvas(p,OUTPUT_SCALE);
      const wPt=c.width/OUTPUT_SCALE*72/72;
      if(wPt>targetW)targetW=wPt;
    }
    if(targetW===0)targetW=842;

    const obiAspect=obiImg.naturalWidth/obiImg.naturalHeight;
    let doc=null,first=true;

    for(let i=0;i<pages.length;i++){
      document.getElementById("loadingText").textContent="処理中... "+(i+1)+"/"+pages.length;
      const p=pages[i];
      const c=await renderPageToCanvas(p,OUTPUT_SCALE);
      const origW=c.width/OUTPUT_SCALE,origH=c.height/OUTPUT_SCALE;
      const s=targetW/origW;

      if(p.skip){
        const pw=targetW,ph=origH*s;
        if(first){doc=new jsPDF({unit:"pt",format:[pw,ph]});first=false}else doc.addPage([pw,ph]);
        doc.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",0,0,pw,ph);
        continue;
      }

      const parts=[];const tl=p.top_line,bl=p.bottom_line,z=p.zones;
      if(z[0]&&tl>0.001)parts.push([0,tl]);
      if(z[1]&&(bl-tl)>0.001)parts.push([tl,bl]);
      if(z[2]&&(1-bl)>0.001)parts.push([bl,1]);
      if(!parts.length)continue;

      const contentH=parts.reduce((a,pr)=>a+(pr[1]-pr[0])*origH*s,0);
      const obiH=targetW/obiAspect;
      const pageH=contentH+obiH;

      if(first){doc=new jsPDF({unit:"pt",format:[targetW,pageH]});first=false}else doc.addPage([targetW,pageH]);

      let yOff=0;
      for(const[start,end] of parts){
        const srcY=Math.round(c.height*start),srcH=Math.round(c.height*(end-start));
        const partCanvas=document.createElement("canvas");
        partCanvas.width=c.width;partCanvas.height=srcH;
        partCanvas.getContext("2d").drawImage(c,0,srcY,c.width,srcH,0,0,c.width,srcH);
        const partH=(end-start)*origH*s;
        doc.addImage(partCanvas.toDataURL("image/jpeg",0.92),"JPEG",0,yOff,targetW,partH);
        yOff+=partH;
      }
      doc.addImage(obiImg.src,"JPEG",0,yOff,targetW,obiH);
    }

    if(!doc){hideLoading();showStatus("processStatus","出力するページがありません","error");return}

    const seen=[];pages.forEach(p=>{if(!seen.includes(p.filename))seen.push(p.filename)});
    let fn=document.getElementById("outputFilename").value.trim();
    if(!fn){const base=seen[0].replace(/\.pdf$/i,"");fn=seen.length>1?base+"_他"+(seen.length-1)+"件_帯替え後.pdf":base+"_帯替え後.pdf"}
    else if(!fn.toLowerCase().endsWith(".pdf"))fn+=".pdf";

    doc.save(fn);
    hideLoading();
    showStatus("processStatus","✓ 完了！全"+pages.length+"ページを出力しました","success");
    const box=document.getElementById("outputBox");box.style.display="block";box.innerHTML="<strong>📁 ダウンロード完了</strong>"+fn;
  }catch(e){hideLoading();showStatus("processStatus","✗ "+e.message,"error");console.error(e)}
};

async function loadJsPDF(){
  if(window.jspdf)return window.jspdf.jsPDF;
  return new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js";
    s.onload=()=>{if(window.jspdf)resolve(window.jspdf.jsPDF);else reject(new Error("jsPDFの初期化に失敗"))};
    s.onerror=()=>reject(new Error("jsPDFの読み込みに失敗しました。ネットワーク接続を確認してください"));
    document.head.appendChild(s);
  });
}

function showStatus(id,msg,type){const el=document.getElementById(id);el.textContent=msg;el.className="status "+type}
function showLoading(t){document.getElementById("loadingText").textContent=t;document.getElementById("loadingOverlay").classList.add("show")}
function hideLoading(){document.getElementById("loadingOverlay").classList.remove("show")}
</script>
</body>
</html>
